  let i = 0;
  const stage = document.getElementById('stage');
  const stageWrap = document.getElementById('stageWrap');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');

  function layout() {
    const scale = Math.min((window.innerWidth * 0.92) / 1280, (window.innerHeight * 0.8) / 720);
    stage.style.transform = 'scale(' + scale + ')';
    stageWrap.style.width = (1280 * scale) + 'px';
    stageWrap.style.height = (720 * scale) + 'px';
  }

  function render() {
    stage.srcdoc = SLIDES[i];
    counter.textContent = (i + 1) + ' / ' + SLIDES.length;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === SLIDES.length - 1;
  }

  function go(delta) {
    const n = i + delta;
    if (n < 0 || n >= SLIDES.length) return;
    i = n;
    render();
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));
  window.addEventListener('resize', layout);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') go(1);
    else if (e.key === 'ArrowLeft') go(-1);
    else if (e.key === 'Home') { i = 0; render(); }
    else if (e.key === 'End') { i = SLIDES.length - 1; render(); }
  });

  layout();
  render();
</script>
